server {
    listen 80;
    server_name www.theonlyconclusion.com;
    return 301 https://theonlyconclusion.com$request_uri;
}

server {
    listen 80 default_server;
    server_name theonlyconclusion.com;

    root /usr/share/nginx/html;
    index index.html;

    port_in_redirect off;
    absolute_redirect off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Short links & aliases from _redirects
    location = /allhands { return 301 /books/all-hands/; }
    location = /allhands/ { return 301 /books/all-hands/; }
    location = /all-hands { return 301 /books/all-hands/; }
    location = /all-hands/ { return 301 /books/all-hands/; }

    location = /musicvault { return 301 /books/the-music-vault/; }
    location = /musicvault/ { return 301 /books/the-music-vault/; }
    location = /music-vault { return 301 /books/the-music-vault/; }
    location = /music-vault/ { return 301 /books/the-music-vault/; }
    location = /the-music-vault { return 301 /books/the-music-vault/; }
    location = /the-music-vault/ { return 301 /books/the-music-vault/; }

    location = /casezero { return 301 /#case-zero; }
    location = /casezero/ { return 301 /#case-zero; }
    location = /case-zero { return 301 /#case-zero; }
    location = /case-zero/ { return 301 /#case-zero; }

    location = /sheets { return 301 /#sheets; }
    location = /sheets/ { return 301 /#sheets; }

    location = /MusicVault-CaseZero { return 301 /musicvault-casezero/; }
    location = /MusicVault-CaseZero/ { return 301 /musicvault-casezero/; }
    location = /music-vault-casezero { return 301 /musicvault-casezero/; }
    location = /music-vault-casezero/ { return 301 /musicvault-casezero/; }

    location = /SugarCamp-CaseZero { return 301 /sugarcamp-casezero/; }
    location = /SugarCamp-CaseZero/ { return 301 /sugarcamp-casezero/; }
    location = /sugar-camp-casezero { return 301 /sugarcamp-casezero/; }
    location = /sugar-camp-casezero/ { return 301 /sugarcamp-casezero/; }

    # Static assets caching
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Main routing
    location / {
        try_files $uri $uri/ =404;
    }

    # Custom 404
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
